  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"e9f45ad0-894b-4ff4-ba2f-49686524a03c\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Caveat Brush';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"71110be1-ae64-4f85-a05e-e92efba08b65\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Caveat Brush';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"44d0d107-1c6a-4a6d-bd11-a3081f645411\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2d4dbef3-8970-4ff6-8db2-324ffa98f651\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"62663769-1175-4be2-a558-3818f5ef7538\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap 348-430f-9734-bad96b2644f3\"><\u002Fscript>\n<title>Painel — Associação Rosário<\u002Ftitle>\n<meta name=\"robots\" content=\"noindex\">\n\n<style>\nbody{margin:0;background:#faf4e1;color:#303030;font-family:'Nunito',system-ui,sans-serif;text-wrap:pretty}\nh1,h2,h3{font-family:'Nunito',system-ui,sans-serif;color:inherit}\na{color:#24647c}a:hover{color:#1c5064}\n:focus-visible{outline:3px solid #d8b76a;outline-offset:2px;border-radius:12px}\n::selection{background:#cfe4f1}\ninput,select,textarea,button{font-family:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ showBoot }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;background:#24647c;display:flex;align-items:center;justify-content:center;color:#ffffff;font-weight:800;font-size:16px\">Carregando…<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"00 Login\" style=\"min-height:100vh;position:relative;overflow:hidden;background:#24647c;display:flex;align-items:center;justify-content:center;padding:32px 20px;box-sizing:border-box\">\n  <div style=\"position:absolute;width:180px;height:180px;border-radius:50%;background:#d8b76a;right:10%;top:14%\"><\u002Fdiv>\n  <div style=\"position:absolute;width:36px;height:36px;border-radius:50%;background:#faf4e1;left:12%;bottom:18%\"><\u002Fdiv>\n  <form sc-camel-on-submit=\"{{ entrar }}\" style=\"position:relative;width:100%;max-width:420px;background:#ffffff;border-radius:32px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.22);display:flex;flex-direction:column;gap:18px;box-sizing:border-box\">\n    <img src=\"42e628e0-e003-4c4c-8218-344de0cc607b\" alt=\"Associação Beneficente Nossa Senhora do Rosário\" style=\"height:56px;width:auto;align-self:flex-start\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <h1 style=\"margin:0;font-weight:900;font-size:28px;line-height:1.1\">{{ loginTitulo }}<\u002Fh1>\n      <p style=\"margin:0;color:#5b6b70;font-size:15px;line-height:1.5\">{{ loginSub }}<\u002Fp>\n    <\u002Fdiv>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px\">E-mail\n      <input type=\"email\" required=\"{{ true }}\" value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ setLoginEmail }}\" placeholder=\"secretaria@abnsrosariobarretos.org.br\" style=\"border:2px solid #dfe7ea;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;color:#303030;background:#ffffff;outline:none\" style-focus=\"border-color:#24647c\">\n    <\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px\">Senha\n      <input type=\"password\" required=\"{{ true }}\" sc-camel-min-length=\"6\" value=\"{{ loginSenha }}\" sc-camel-on-change=\"{{ setLoginSenha }}\" style=\"border:2px solid #dfe7ea;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;color:#303030;background:#ffffff;outline:none\" style-focus=\"border-color:#24647c\">\n    <\u002Flabel>\n    <sc-if value=\"{{ isCriar }}\" hint-placeholder-val=\"{{ false }}\">\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px\">Repita a senha\n        <input type=\"password\" required=\"{{ true }}\" sc-camel-min-length=\"6\" value=\"{{ loginSenha2 }}\" sc-camel-on-change=\"{{ setLoginSenha2 }}\" style=\"border:2px solid #dfe7ea;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;color:#303030;background:#ffffff;outline:none\" style-focus=\"border-color:#24647c\">\n      <\u002Flabel>\n    <\u002Fsc-if>\n    <button type=\"submit\" style=\"border:0;cursor:pointer;background:#24647c;color:#ffffff;font-weight:800;font-size:16px;padding:15px 22px;border-radius:999px;text-align:left\" style-hover=\"background:#1c5064\">{{ entrarLabel }}<\u002Fbutton>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px 20px\">\n      <sc-if value=\"{{ isEntrarModo }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ esqueci }}\" style=\"border:0;background:transparent;cursor:pointer;color:#24647c;font-weight:700;font-size:14px;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px\">Esqueci minha senha<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ loginMsg }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;background:#e8f2f8;color:#1c5064;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700\">{{ loginMsg }}<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fform>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height:100vh;display:flex;flex-wrap:wrap;background:#faf4e1\">\n\n  <aside style=\"flex:1 0 230px;background:#24647c;color:#ffffff;display:flex;flex-direction:column;gap:22px;padding:22px 16px;box-sizing:border-box\">\n    <div style=\"background:#ffffff;border-radius:20px;padding:10px 14px;display:flex;align-items:center\">\n      <img src=\"42e628e0-e003-4c4c-8218-344de0cc607b\" alt=\"Associação Rosário\" style=\"height:42px;width:auto\">\n    <\u002Fdiv>\n    <nav aria-label=\"Painel\" style=\"display:flex;flex-direction:column;gap:4px\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"border:0;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:{{ n.bg }};color:{{ n.fg }};font-weight:800;font-size:15px;text-align:left\" style-hover=\"background:#1c5064;color:#ffffff\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ n.icon }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex:1\">{{ n.label }}<\u002Fspan>\n          <sc-if value=\"{{ n.count }}\" hint-place te.' : 'Publicado no site.');\n        } catch (e) { this.flash(this.msgErro(e)); }\n      },\n      edit: () => this.open(s, it),\n      del: () => this.setState({ confirm: { sec: s, id: it.id, nome } })\n    });\n    let rows = [];\n    if (SECS[sec]) {\n      const q = norm(this.state.busca);\n      const list = D[sec].filter(it => !q || norm(Object.values(it).join(' ')).includes(q));\n      if (sec === 'agenda') rows = [...list].sort((a, b) => a.data.localeCompare(b.data)).map(e => {\n        const passou = e.data < HOJE;\n        return { ...common(sec, e, e.titulo), hasDate: true, ...parts(e.data), titulo: e.titulo, meta: [e.hora, e.local, e.tipo, e.arte ? 'com arte' : ''].filter(Boolean).join(' · '),\n          ...(passou ? { badge: 'Já passou', badgeBg: '#eceae4', badgeFg: '#4d4d4d' } : pubBadge(e.publicado, 'Oculto')), opacity: passou ? 0.7 : 1 };\n      });\n      if (sec === 'noticias') rows = [...list].sort((a, b) => b.data.localeCompare(a.data)).map(n => ({ ...common(sec, n, n.titulo), titulo: n.titulo, meta: `${fmt(n.data)} · ${n.cat}${n.foto ? ' · com foto' : ''}`, ...pubBadge(n.publicado, 'Rascunho') }));\n      if (sec === 'transparencia') rows = this.ordenarDocs(list).map(d => ({ ...common(sec, d, d.nome), ...this.moveVals(d), titulo: d.nome, meta: [d.cat, d.ano, baseName(d.arquivo) || 'sem arquivo'].filter(Boolean).join(' · '), ...pubBadge(d.publicado, 'Oculto') }));\n      if (sec === 'equipe') rows = [...list].sort((a, b) => a.email.localeCompare(b.email)).map(p => {\n        const eu = p.email.toLowerCase() === (this.state.usuario || '').toLowerCase();\n        return { ...common(sec, p, p.email), titulo: p.email + (eu ? ' (você)' : ''),\n          meta: p.temConta ? (p.ultimo ? 'Último acesso em ' + fmt(p.ultimo) : 'Já criou a senha') : 'Ainda não criou a senha',\n          ...(p.temConta ? { badge: 'Ativo', badgeBg: '#dcefe3', badgeFg: '#1f6b3d' } : { badge: 'Convidado', badgeBg: '#f4e7b2', badgeFg: '#5a4a12' }),\n          canEdit: false, canToggle: !eu && !p.semTabela, toggleLabel: 'Nova senha', canDel: !eu && !p.semTabela,\n          toggle: () => this.novaSenha(p.email) };\n      });\n      if (sec === 'emails') rows = [...list].sort((a, b) => b.data.localeCompare(a.data)).map(m => ({ ...common(sec, m, m.email), titulo: m.email, meta: `Cadastro em ${fmt(m.data)} · ${m.lgpd ? 'Consentimento LGPD registrado' : 'Sem consentimento'}`, badge: 'Ativo', badgeBg: SKY, badgeFg: '#1c5064' }));\n    }\n\n    let form = null;\n    const F = this.state.form;\n    if (F) {\n      const v = F.values, files = F.files || {};\n      form = {\n        titulo: (F.id ? 'Editar ' : 'Adicionar ') + SECS[F.sec].item,\n        erro: F.erro,\n        fields: FIELDS[F.sec].map(f => {\n          const on = !!v[f.k];\n          const pend = files[f.k];\n          return {\n            label: f.l, span: f.full ? '1 / -1' : 'auto', ph: f.ph || '', rows: f.rows || 3, accept: f.accept || '',\n            opts: f.sugestoes ? [...new Set(['Balanço Patrimonial', ...(D[F.sec] || []).map(d => (d.cat || '').trim()).filter(Boolean)])] : (f.opts || []),\n            listId: f.sugestoes ? 'sug-' + f.k : undefined, temSug: !!f.sugestoes,\n            isText: f.t === 'text' || f.t === 'date', inputType: f.t === 'date' ? 'date' : 'text',\n            isArea: f.t === 'area', isSelect: f.t === 'select', isFile: f.t === 'file', isToggle: f.t === 'toggle',\n            value: f.t === 'toggle' || f.t === 'file' ? undefined : (v[f.k] ?? ''),\n            border: F.erro && f.req && !v[f.k] ? '#a33a2a' : '#dfe7ea',\n            onChange: (e) => this.setVal(f.k, e.target.value),\n            onFile: (e) => { const file = e.target.files && e.target.files[0]; if (file) this.setFile(f.k, file); },\n            fileLabel: pend ? pend.name : (v[f.k] ? baseName(v[f.k]) + ' (atual — clique para trocar)' : 'Clique para escolher o arquivo'),\n            checked: on, flip: () => this.setVal(f.k, !on),\n            track: on ? BLUE : '#cfd8db', knob: on ? '25px' : '3px',\n            stateLabel: on ? (f.on || 'Sim — aparece no site') : (f.off || 'Não — fica oculto')\n          };\n        })\n      };\n    }\n\n    return {\n      showBoot: logado === null, showLogin: logado === false, showApp: logado === true,\n      usuario: this.state.usuario,\n      loginEmail: this.state.loginEmail, loginSenha: this.state.loginSenha, loginMsg: this.state.loginMsg,\n      entrarLabel: this.state.entrando ? 'Aguarde…' : (this.state.modo === 'criar' ? 'Criar minha senha →' : 'Entrar →'),\n      isCriar: this.state.modo === 'criar', isEntrarModo: this.state.modo !== 'criar',\n      loginTitulo: this.state.modo === 'criar' ? 'Primeiro acesso' : 'Painel da Associação',\n      loginSub: this.state.modo === 'criar' ? 'Use o e-mail que a Associação cadastrou na Equipe e escolha sua senha (mínimo 6 caracteres).' : 'Acesso exclusivo da equipe.',\n      trocarLabel: this.state.modo === 'criar' ? 'Já tenho senha — entrar' : 'Primeiro acesso — criar minha senha',\n      trocarModo: () => this.setState(s => ({ modo: s.modo === 'criar' ? 'entrar' : 'criar', loginMsg: '', loginSenha: '', loginSenha2: '' })),\n      loginSenha2: this.state.loginSenha2,\n      setLoginSenha2: (e) => this.setState({ loginSenha2: e.target.value }),\n      setLoginEmail: (e) => this.setState({ loginEmail: e.target.value }),\n      setLoginSenha: (e) => this.setState({ loginSenha: e.target.value }),\n      entrar: async (e) => {\n        e.preventDefault();\n        if (this.state.entrando) return;\n        if (this.state.modo === 'criar') {\n          const email = this.state.loginEmail.trim().toLowerCase();\n          if (this.state.loginSenha !== this.state.loginSenha2) { this.setState({ loginMsg: 'As duas senhas não são iguais.' }); return; }\n          this.setState({ entrando: true, loginMsg: '' });\n          try {\n            const sb = await this.sb();\n            const { data, error } = await sb.auth.signUp({ email, password: this.state.loginSenha, options: { emailRedirectTo: location.origin + location.pathname } });\n            if (error) {\n              const m = error.message || '';\n              const msg = /autorizado|Database error/i.test(m) ? 'Este e-mail não está na Equipe. Peça a um administrador para adicionar você.'\n                : /not allowed|disabled/i.test(m) ? 'O cadastro está desligado no Supabase. Peça ao responsável para ligar \"Allow new users to sign up\".'\n                : /already|registered/i.test(m) ? 'Este e-mail já tem senha. Use \"Já tenho senha — entrar\".'\n                : /password/i.test(m) ? 'Senha fraca. Use pelo menos 6 caracteres, misturando letras e números.' : this.msgErro(error);\n              this.setState({ entrando: false, loginMsg: msg }); return;\n            }\n            if (data.user && data.user.identities && data.user.identities.length === 0) { this.setState({ entrando: false, modo: 'entrar', loginMsg: 'Este e-mail já tem senha. Entre normalmente ou use \"Esqueci minha senha\".' }); return; }\n            if (data.session) { this.entrou(data.session); return; }\n            this.setState({ entrando: false, modo: 'entrar', loginSenha: '', loginSenha2: '', loginMsg: 'Pronto! Enviamos um e-mail de confirmação. Clique no link do e-mail e depois entre aqui com sua senha.' });\n          } catch (err) { this.setState({ entrando: false, loginMsg: this.msgErro(err) }); }\n          return;\n        }\n        this.setState({ entrando: true, loginMsg: '' });\n        try {\n          const sb = await this.sb();\n          const { data, error } = await sb.auth.signInWithPassword({ email: this.state.loginEmail.trim(), password: this.state.loginSenha });\n          if (error) {\n            const msg = /confirm/i.test(error.message) ? 'Este e-mail ainda não foi confirmado.' : /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : this.msgErro(error);\n            this.setState({ entrando: false, loginMsg: msg }); return;\n          }\n          this.entrou(data.session);\n        } catch (err) { this.setState({ entrando: false, loginMsg: this.msgErro(err) }); }\n      },\n      esqueci: async () => {\n        const email = this.state.loginEmail.trim();\n        if (!email) { this.setState({ loginMsg: 'Digite seu e-mail no campo acima e clique de novo em \"Esqueci minha senha\".' }); return; }\n        try {\n          const sb = await this.sb();\n          await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });\n        } catch (err) {}\n        this.setState({ loginMsg: 'Se o e-mail estiver cadastrado, enviaremos um link para criar uma nova senha.' });\n      },\n      alterarSenha: () => this.novaSenha(),\n      senhaModal: this.state.senha ? { ...this.state.senha,\n        titulo: this.state.senha.alvo ? 'Nova senha para a pessoa' : 'Alterar minha senha',\n        sub: this.state.senha.alvo ? 'Defina uma nova senha para ' + this.state.senha.alvo + '. Depois envie para a pessoa.' : 'Escolha uma senha nova com pelo menos 6 caracteres.',\n        botao: this.state.senha.salvando ? 'Salvando…' : 'Salvar senha' } : null,\n      setNova: (e) => { const v = e.target.value; this.setState(st => ({ senha: { ...st.senha, nova: v, erro: '' } })); },\n      setNova2: (e) => { const v = e.target.value; this.setState(st => ({ senha: { ...st.senha, nova2: v, erro: '' } })); },\n      salvarSenha: (e) => { e.preventDefault(); this.gravarSenha(); },\n      fecharSenha: () => this.setState({ senha: null }),\n      sair: async () => {\n        if (this.demo) { this.flash('No modo demonstração não há login.'); return; }\n        const sb = await this.sb(); await sb.auth.signOut();\n        this.setState({ logado: false, sec: 'visao', data: EMPTY, usuario: '' });\n      },\n      erroGeral: this.state.erroGeral, carregando: this.state.carregando, recarregar: () => this.carregar(),\n      nav, resumo, proximo, semProximo: !proximo, rapidas,\n      isVisao: sec === 'visao', isLista: !!SECS[sec], sec: SECS[sec] || {},\n      busca: this.state.busca, setBusca: (e) => this.setState({ busca: e.target.value }),\n      rows, vazio: SECS[sec] && rows.length === 0 && !this.state.carregando ? SECS[sec].vazio : '',\n      novo: () => this.open(sec),\n      exportar: () => {\n        const csv = 'email,data_cadastro,consentimento_lgpd\\n' + D.emails.map(m => `${m.email},${m.data},${m.lgpd ? 'sim' : 'nao'}`).join('\\n');\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));\n        a.download = `emails-associacao-${HOJE}.csv`; a.click();\n        this.flash('Planilha baixada.');\n      },\n      form,\n      salvando: this.state.salvando,\n      salvarLabel: this.state.salvando ? 'Salvando…' : 'Salvar',\n      fechar: () => { if (!this.state.salvando) this.setState({ form: null }); },\n      salvar: async (e) => {\n        e.preventDefault();\n        const F = this.state.form;\n        if (!F || this.state.salvando) return;\n        const { sec: s, id } = F;\n        const files = F.files || {};\n        const values = { ...F.values };\n        const falta = FIELDS[s].filter(f => f.req && !values[f.k] && !files[f.k]).map(f => f.l.replace(' *', ''));\n        if (falta.length) { this.setState(st => ({ form: { ...st.form, erro: 'Preencha: ' + falta.join(', ') + '.' } })); return; }\n        if (s === 'equipe' && !EMAIL_OK(values.email.trim())) { this.setState(st => ({ form: { ...st.form, erro: 'Digite um e-mail válido.' } })); return; }\n        if (s === 'equipe' && (values.senha || '').length < 6) { this.setState(st => ({ form: { ...st.form, erro: 'A senha precisa ter pelo menos 6 caracteres.' } })); return; }\n        this.setState({ salvando: true });\n        try {\n          for (const k of Object.keys(files)) values[k] = this.demo ? files[k].name : await this.upload(s, files[k]);\n          if (s === 'transparencia' && !id && (this.state.data.transparencia || []).some(x => x.ordem != null)) values.ordem = Math.max(0, ...this.state.data.transparencia.map(x => x.ordem || 0)) + 1;\n          const row = await this.persist(id ? 'update' : 'insert', s, id, values);\n          this.updateList(s, l => id ? l.map(x => x.id === id ? { ...x, ...row } : x) : [...l, row]);\n          this.setState({ form: null, salvando: false });\n          if (s === 'equipe') { const ok = await this.copiar(this.convite(row.email, values.senha)); this.flash(ok ? 'Pessoa adicionada — acesso copiado para enviar.' : 'Pessoa adicionada.'); }\n          else this.flash(values.publicado ? 'Salvo — já aparece no site.' : 'Salvo (oculto no site).');\n        } catch (err) { this.setState(st => ({ salvando: false, form: st.form && { ...st.form, erro: this.msgErro(err) } })); }\n      },\n      confirm: this.state.confirm,\n      confirmar: async () => {\n        const { sec: s, id } = this.state.confirm;\n        try {\n          await this.persist('delete', s, id);\n          this.updateList(s, l => l.filter(x => x.id !== id));\n          this.setState({ confirm: null }); this.flash('Item excluído.');\n        } catch (err) { this.setState({ confirm: null }); this.flash(this.msgErro(err)); }\n      },\n      cancelar: () => this.setState({ confirm: null }),\n      toast: this.state.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
